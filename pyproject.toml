[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-classifier"
version = "2.0.0"
description = "Classify and summarise PDFs, text files, web pages and YouTube videos with Hugging Face models: Streamlit UI, FastAPI service and CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sharleen Mwikali Muoki" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "langdetect>=1.0.9",
    "pydantic>=2.6",
    "pypdf>=4.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
models = ["transformers>=4.40,<6", "torch>=2.2", "sentencepiece>=0.2"]
ui = ["streamlit>=1.36"]
browser = ["playwright>=1.44"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
text-classifier = "text_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["text_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "models: downloads real Hugging Face models (slow)",
    "browser: launches headless Chromium via Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
