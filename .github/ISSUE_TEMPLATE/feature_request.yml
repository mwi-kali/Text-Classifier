name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Sketch the API, CLI flag or UI you have in mind.
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: How will we know this is finished (tests, metrics, docs)?
