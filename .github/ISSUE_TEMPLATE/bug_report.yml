name: Bug report
description: Something is broken or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pip install -e ".[dev]"
        2. run ...
        3. see error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, package version (pip show ...)
