name: CI

on:
  push:
    branches: [main, master, portfolio-refresh]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e ".[api,browser,dev]"
      - name: Install headless Chromium (JS-rendered page tests)
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (models faked)
        run: pytest --cov=text_classifier --cov-report=term-missing

  models:
    name: Real-model smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      TC_ZERO_SHOT_MODEL: typeform/distilbert-base-uncased-mnli
      TC_SUMMARY_MODEL: sshleifer/distilbart-cnn-12-6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.TC_ZERO_SHOT_MODEL }}-${{ env.TC_SUMMARY_MODEL }}
      - run: >
          uv pip install --system -e ".[models,dev]"
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match
      - run: pytest -m models
      - name: Summary quality + performance (ROUGE-L, compression, readability, latency)
        run: |
          text-classifier evaluate
          cat reports/summary_eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: CLI end to end
        run: text-classifier analyze --text "$(python -c 'print(open("README.md").read()[:3000])')"

  docker:
    name: Build & health-check API image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t text-classifier-api:ci .
      - run: |
          docker run -d --name api -p 8000:8000 text-classifier-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
